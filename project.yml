# Receta para que XcodeGen arme el proyecto de Xcode.
# El proyecto (.xcodeproj) no se guarda en el repositorio: se genera en cada compilación.
name: ComicUnlimited
options:
  bundleIdPrefix: com.ivorudz
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.28"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ComicUnlimited:
    type: application
    platform: iOS
    sources:
      - path: ComicUnlimited
    info:
      path: ComicUnlimited/Info.plist
      properties:
        CFBundleDisplayName: "Cómic Unlimited"
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # La app va derecha; solo el lector de tus archivos deja girar el teléfono (ver Orientation.swift).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivorudz.comicunlimited
        PRODUCT_NAME: ComicUnlimited
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libarchive (viene en iOS) para convertir .cbr (RAR) a .cbz
        SWIFT_OBJC_BRIDGING_HEADER: ComicUnlimited/ComicUnlimited-Bridging-Header.h
        OTHER_LDFLAGS: "-larchive"
        ENABLE_PREVIEWS: NO
